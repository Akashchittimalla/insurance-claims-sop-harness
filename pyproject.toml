[project]
name = "insurance-claims-sop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3", "PyYAML>=6,<7", "fastapi>=0.115,<1", "langgraph>=1,<2", "langsmith>=0.4,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["apps.insurance_claims*"]

[tool.setuptools.package-data]
"apps.insurance_claims" = ["sop.yaml", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
